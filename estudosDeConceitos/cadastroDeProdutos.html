<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>
<style>
    button {
        width: max-content;
        padding: 8px 5px;

        color: white;
        background-color: rgb(60, 60, 155);
        border: solid 1px white;
        border-radius: 5px;

        transition: all .2s ease;
    }

    button:hover {
        transform: scale(1.02);
        cursor: pointer;
    }

    input {
        padding: 5px;
        text-align: center;
    }

    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    body {
        color: white;
        font: normal 1em arial;
        background-color: rgb(50, 50, 99);

        padding-top: 60px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    form {
        width: 300px;
        background-color: rgb(110, 110, 173);
        padding: 20px;
        border-radius: 20px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    #filtros {
        width: 300px;
        background-color: rgb(110, 110, 173);
        padding: 20px;
        border-radius: 20px;

        display: flex;
        justify-content: center;
        gap: 10px;
    }
</style>
<body>
    <h1>Cadastro de Produtos</h1>
    <form id="form">
        <input id="nome" type="text" placeholder="Nome do produto">
        <input id="preco" type="number" placeholder="Preço">

        <button type="submit">Adicionar</button>
    </form>

    <div id="filtros">
        <button data-filtro="todos">Todos</button>
        <button data-filtro="baratos">Até R$100</button>
        <button data-filtro="caros">Acima de R$100</button>
    </div>

    <div id="lista"></div>

    <p id="resultado"></p>

    <script>
        
    </script>
</body>
</html>
