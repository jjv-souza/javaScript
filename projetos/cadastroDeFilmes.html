<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Filmes</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        padding: 50px 20px;

        font-family: Arial;
        background-image: linear-gradient(#95c4c4, #103c44);
        color: black;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      /* --- FORMULARIO --- */
      form {
        width: 350px;
        padding: 30px;

        background-color: #eee;
        border-radius: 10px;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15);

        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      form h1 {
        margin-bottom: 10px;
        text-align: center;
      }

      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      form button {
        padding: 10px;
        border: none;
        border-radius: 5px;

        background-color: #333;
        color: white;

        cursor: pointer;
      }

      /* --- Filtros --- */

      #filtros {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      #filtros button {
        padding: 8px 12px;
        border: none;
        border-radius: 5px;

        background-color: #333;
        color: white;

        cursor: pointer;
      }

      /* --- Lista --- */

      #lista {
        width: 350px;

        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* --- Filmes --- */
      article {
        padding: 20px;
        cursor: pointer;

        background-color: #eee;
        border-radius: 10px;
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;

        transition: background .2s ease;
      }

      article:hover {
        background-color: rgb(255, 189, 189);
      }

      article h2 {
        font-size: 1.2em;
      }

      article p {
        color: #555;
      }

    </style>
  </head>
  <body>
    <form id="form">
      <h1>Filmes</h1>
      <input id="titulo" type="text" placeholder="Nome do filme" />
      <input id="nota" type="number" step="0.1" placeholder="Nota" />

      <button type="submit">Adicionar</button>
    </form>

    <div id="filtros">
      <button data-filtro="todos">Todos</button>
      <button data-filtro="bons">Nota 9+</button>
      <button data-filtro="medianos">Nota abaixo de 9</button>
    </div>

    <div id="lista"></div>

    <script>
      let filmes = [
        { id: crypto.randomUUID(), titulo: "Interestelar", nota: 9 },
        { id: crypto.randomUUID(), titulo: "O Batman", nota: 8 },
        { id: crypto.randomUUID(), titulo: "Shrek", nota: 10 },
        { id: crypto.randomUUID(), titulo: "Corra!", nota: 8.5 },
      ];

      //--- DOM ---//
      const lista = document.getElementById("lista");
      const form = document.getElementById("form");
      const filtros = document.getElementById("filtros");

      //--- Funções ---//
      function criarFilme(filme) {
        const card = document.createElement("article");
        card.dataset.id = filme.id

        const nome = document.createElement("h2");
        nome.textContent = filme.titulo;

        const nota = document.createElement("p");
        nota.textContent = "nota: " + filme.nota;

        card.appendChild(nome);
        card.appendChild(nota);
        lista.appendChild(card);
      }

      //--- Input ---//
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const inputNome = document.getElementById("titulo");
        const inputNota = document.getElementById("nota");

        if (inputNome.value.trim() !== "" && inputNota.value.trim() !== "") {
          const novoFilme = {
            id: crypto.randomUUID(),
            titulo: inputNome.value,
            nota: inputNota.value,
          };

          filmes.push(novoFilme);
          criarFilme(novoFilme);

          localStorage.setItem('filmes', JSON.stringify(filmes))

          inputNome.value = "";
          inputNota.value = "";
        }
      });

      lista.addEventListener('click', (e) => {
        const card = e.target.closest('article')
        const id = card.dataset.id

        filmes = filmes.filter((i)=>{
          return i.id !== id
        })

        localStorage.setItem('filmes', JSON.stringify(filmes))

        card.remove()
      })

      //--- Filtros --- //
      filtros.addEventListener("click", (e) => {
        const botao = e.target.closest("button");
        if (!botao) return;

        if (botao.dataset.filtro === "bons") {
          const bons = filmes.filter((item) => {
            return item.nota >= 9;
          });
          lista.innerHTML = "";
          bons.forEach((item) => {
            criarFilme(item);
          });
        
        } else if (botao.dataset.filtro === "medianos") {
          const medio = filmes.filter((item) => item.nota < 9);
          lista.innerHTML = "";
          medio.forEach((item) => criarFilme(item));

        } else if (botao.dataset.filtro === "todos") {
          lista.innerHTML = "";
          filmes.forEach((item) => criarFilme(item));
        }
      });

      const dados = JSON.parse(localStorage.getItem('filmes'))

      if(dados){
        filmes = dados
      } 
      filmes.forEach((item)=> criarFilme(item))
    </script>
  </body>
</html>
